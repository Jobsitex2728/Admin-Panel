name: Deploy Dashboard to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_PEM_KEY }}" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem

      - name: Deploy dist to EC2 via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/jobsitex-dashboard/

      - name: Reload Nginx
        run: |
          ssh -i /tmp/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl reload nginx"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key.pem
